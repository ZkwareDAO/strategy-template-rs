# template_trend — 期货单标（CU）：EMA 触发 + 趋势过滤 + ATR 止损（原 futures_single_trend 语义）
strategy_type: template_trend
strategy_id: template_trend:cu

universe:
  - { symbol: CU, exchange: SHFE }
timeframes: [15m, 1h]

indicators: {}
entry: { default: [] }
exit: { default: [] }
portfolio_exit: { stop_loss_pct: 8 }
risk: { max_total_notional: 1.0 }
sizing: { per_position_pct: 1.0 }

params:
  entry_mode: ema_trend
  trigger_ema: 60
  trend_tf: "1h"
  trend_ema: 60
  stop_mode: atr
  atr_period: 14
  atr_stop_mult: 2.0
