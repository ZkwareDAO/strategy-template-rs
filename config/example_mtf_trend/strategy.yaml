# example_mtf_trend — 多周期教学样例（统一端口 strategy.yaml，N=1）
strategy_type: example_mtf_trend
strategy_id: example_mtf_trend:btc

universe:
  - { symbol: BTCUSDT, exchange: binance }

# [0] = base TF（决策节奏，对齐旧 timeframe: 4h）；1d 供趋势 EMA 过滤
timeframes: [4h, 1m, 1d]

indicators: {}
entry: { default: [] }
exit: { default: [] }

portfolio_exit: { stop_loss_pct: 8 }
risk: { max_total_notional: 1.0 }
sizing: { per_position_pct: 1.0 }

params:
  fast_period: 10
  slow_period: 30
  trend_ema_period: 50
  atr_period: 14
  atr_stop_mult: 2.0
