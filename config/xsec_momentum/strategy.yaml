# xsec_momentum — 横截面示例策略配置（设计 §5.1；PR-4）
# 用法：backtest 单组用 --config 本文件；run 多组用 --config <配置集根目录>
# （布局与拒启规则见 RUNBOOK §5.5）
strategy_type: xsec_momentum
# mode 省略 = cross_sectional；multi_instance 本期拒启（§5.7）
strategy_id: xsec_momentum:default

universe: # 加一行代币 = 从单标升级横截面（渐进式，§5.2）
  - BTCUSDT
  - ETHUSDT
timeframes: [5m, 15m] # [0] = base TF（决策节奏）

indicators: # 指标级 tf 绑定（两级周期，§5.5）
  adx: { tf: 5m, period: 14 }
  macd: { tf: 15m, fast: 12, slow: 26, signal: 9 }

entry: # 开仓硬门（default + per-symbol overrides，AND；§5.4 校验 ind 必须声明）
  default: [ { ind: adx, op: ">", value: 20 } ]

exit: # 每代币自己的平仓逻辑（与 entry 对称；空 = 只由策略/组合风控决定）
  default: []
  overrides:
    ETHUSDT: [ { ind: macd_cross, op: "==", value: bullish } ]

portfolio_exit: # 总仓位止盈止损（度量 = MasterPosition，成本名义口径）
  trailing: { arm_pnl_pct: 10, giveback_pct: 40 }
  stop_loss_pct: 8

rebalance: { every_bars: 96, top_k: 3, bottom_k: 0, weight_scheme: equal }
risk: { max_total_notional: 0.80 } # max_drawdown(L4) 本期解析但忽略并告警
sizing: { per_position_pct: 0.10 }

params: { top_k: 3 } # 策略私有参数（alpha 在代码，配置只承载过滤/风控，§5.8）
