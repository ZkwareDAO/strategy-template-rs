# example_dual_ma — 国内期货（CU）单标样例（统一端口 strategy.yaml，N=1）
strategy_type: example_dual_ma
strategy_id: example_dual_ma:cu

universe:
  - { symbol: CU, exchange: SHFE }

timeframes: [1h, 1m] # [0] = base TF（决策节奏，对齐旧 timeframe: 1h）

indicators: {}
entry: { default: [] }
exit: { default: [] }

portfolio_exit: { stop_loss_pct: 8 }
risk: { max_total_notional: 1.0 }
sizing: { per_position_pct: 1.0 }

params:
  fast_period: 10
  slow_period: 30
  stop_loss_pct: 2.0
  exit_price_source: close
