# template_xsec — crypto 横截面：MACD 排名 + 等权调仓（原 xsec_momentum 语义）
strategy_type: template_xsec
strategy_id: template_xsec:crypto

universe:
  - BTCUSDT
  - ETHUSDT
timeframes: [5m, 15m]

indicators:
  adx: { tf: 5m, period: 14 }
  macd: { tf: 15m, fast: 12, slow: 26, signal: 9 }

entry:
  default: [ { ind: adx, op: ">", value: 20 } ]
exit: { default: [] }
portfolio_exit:
  trailing: { arm_pnl_pct: 10, giveback_pct: 40 }
  stop_loss_pct: 8
rebalance: { every_bars: 96, top_k: 2, bottom_k: 0, weight_scheme: equal }
risk: { max_total_notional: 0.80 }
sizing: { per_position_pct: 0.10 }

params:
  rank_indicator: macd
  higher_is_better: true
  top_k: 2
  flat_entry: true
  stop_mode: percent
  stop_loss_pct: 2.0
