      close: 0.00005
      close_today: 0.00005   # 平今同开仓 0.5‱

  # 上期所 螺纹钢（10 吨/手，最小变动 1 元/吨）
  RB:
    name: 螺纹钢
    multiplier: 10
    tick_size: 1
    margin_rate: 0.10
    min_lots: 1
    session_opens: ["09:00", "21:00"]
    no_trade_after_open_minutes: 5
    session_closes: ["15:00", "23:00"]
    no_trade_before_close_minutes: 5
    commission:
      mode: rate
      open: 0.0001           # 0.1‰
      close: 0.0001
      close_today: 0.0001    # 平今同开仓 1‱

  # 上期所 天然橡胶（10 吨/手，最小变动 5 元/吨）
  RU:
    name: 天然橡胶
    multiplier: 10
    tick_size: 5
