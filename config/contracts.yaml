    min_lots: 1
    session_opens: ["09:00", "21:00"]
    no_trade_after_open_minutes: 5
    session_closes: ["15:00", "23:00"]
    no_trade_before_close_minutes: 5
    commission:
      mode: rate
      open: 0.00005          # 0.5‱
      close: 0.00005
      close_today: 0.0       # 平今免收

  # 上期所 纸浆（10 吨/手，最小变动 2 元/吨）
  SP:
    name: 纸浆
    multiplier: 10
    tick_size: 2
    margin_rate: 0.10
    min_lots: 1
    session_opens: ["09:00", "21:00"]
    no_trade_after_open_minutes: 5
    session_closes: ["15:00", "23:00"]
    no_trade_before_close_minutes: 5
    commission:
