    session_closes: ["15:00", "23:00"]
    no_trade_before_close_minutes: 5
    commission:
      mode: rate
      open: 0.00002          # 0.2‱
      close: 0.00002
      close_today: 0.00002   # 平今同开仓 0.2‱

  # 大商所 铁矿石（100 吨/手，最小变动 0.5 元/吨）
  I:
    name: 铁矿石
    multiplier: 100
    tick_size: 0.5
    margin_rate: 0.08
    min_lots: 1
    session_opens: ["09:00", "21:00"]
    no_trade_after_open_minutes: 5
    session_closes: ["15:00", "23:00"]
    no_trade_before_close_minutes: 5
    commission:
      mode: rate
      open: 0.0001           # 万分之一（2026-10 公开标准）
      close: 0.0001
      close_today: 0.0001    # 平今同开仓

  # ============================================================
  # 跨期套利合成价差标的（spread_prep --product X 生成；cta_spread_arb_v1 使用）
  # 统一口径：multiplier=品种每手吨数（价差 1 点/克 = mult 元/组）；
  #   margin_rate = 两腿交易所保证金合计；commission per_lot = 两腿合计
  #   元/组·单边（按该品种中位价折算，避免 rate×固定基准跨年代失真——CU 教训）；
  #   时段复制品种条目。基准价见各 config/cta_spread_arb_v1/{SYM}.yaml spread_base。
  # ============================================================
  AUSP:
    name: 黄金跨性价差（主力-次主力）
    multiplier: 1000
    tick_size: 0.02
    margin_rate: 0.32
    min_lots: 1
    session_opens: ["09:00", "21:00"]
    no_trade_after_open_minutes: 5
    session_closes: ["15:00", "02:30"]
    no_trade_before_close_minutes: 5
