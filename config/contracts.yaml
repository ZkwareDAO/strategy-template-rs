    min_lots: 1
    session_opens: ["09:00", "21:00"]
    no_trade_after_open_minutes: 5
    session_closes: ["15:00", "23:00"]
    no_trade_before_close_minutes: 5
    commission:
      mode: per_lot
      open: 3.0              # 3 元/手
      close: 3.0
      close_today: 0.0       # 平今免收

  # 上期所 燃料油（10 吨/手，最小变动 1 元/吨）
  FU:
    name: 燃料油
    multiplier: 10
    tick_size: 1
    margin_rate: 0.16
    min_lots: 1
    session_opens: ["09:00", "21:00"]
    no_trade_after_open_minutes: 5
    session_closes: ["15:00", "23:00"]
    no_trade_before_close_minutes: 5
    commission:
      mode: rate
      open: 0.00005          # 0.5‱
      close: 0.00005
      close_today: 0.0       # 平今免收

  # 上期所 石油沥青（10 吨/手，最小变动 1 元/吨）
  BU:
    name: 石油沥青
