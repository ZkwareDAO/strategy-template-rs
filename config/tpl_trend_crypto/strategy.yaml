# template_trend — crypto 多标：双均线交叉 + 百分比止损（逐标的独立总仓）
strategy_type: template_trend
strategy_id: template_trend:multi
merge_positions: false

universe:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
timeframes: [1h, 1m] # [0] = 决策周期

indicators: {}
entry: { default: [] }
exit: { default: [] }
portfolio_exit: { stop_loss_pct: 8 }
risk: { max_total_notional: 1.0 }
sizing: { per_position_pct: 1.0 }

params:
  entry_mode: dual_ma
  fast_period: 10
  slow_period: 30
  stop_mode: percent
  stop_loss_pct: 2.0
