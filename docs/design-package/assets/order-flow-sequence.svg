<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 980" width="980" height="980"
     font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#3b5f94"/>
    </marker>
    <marker id="arrBack" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#b07d2a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="980" fill="#ffffff"/>
  <text x="28" y="38" font-size="17" font-weight="700" fill="#1f2937">订单流时序图（决策 → 成交 → 仓位）</text>
  <text x="28" y="58" font-size="11" fill="#6b7280">§2.2 · 左侧编号为消息序号 · RuntimeActor 单写者内同 task 直调（12/13 无跨 task 通道）</text>

  <!-- ===== 参与者头卡 ===== -->
  <rect x="43" y="76" width="124" height="52" rx="10" fill="#d5ecdc" stroke="#7fc08f" stroke-width="1.5"/>
  <text x="105" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#245c34">Strategy</text>
  <text x="105" y="116" text-anchor="middle" font-size="10" fill="#3f7a52">策略插件</text>

  <rect x="171" y="76" width="124" height="52" rx="10" fill="#e3d8f7" stroke="#a98fe0" stroke-width="1.5"/>
  <text x="233" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c2e94">RuntimeActor</text>
  <text x="233" y="116" text-anchor="middle" font-size="10" fill="#6a4fa3">引擎 · 单写者内核</text>

  <rect x="299" y="76" width="124" height="52" rx="10" fill="#d5ecdc" stroke="#7fc08f" stroke-width="1.5"/>
  <text x="361" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#245c34">SignalManager</text>
  <text x="361" y="116" text-anchor="middle" font-size="10" fill="#3f7a52">8 态 · 重试 · 对账</text>

  <rect x="427" y="76" width="124" height="52" rx="10" fill="#f7ecc8" stroke="#d9bb63" stroke-width="1.5"/>
  <text x="489" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5f14">OrderGateway</text>
  <text x="489" y="116" text-anchor="middle" font-size="10" fill="#8d742e">同步 / 异步端口</text>

  <rect x="555" y="76" width="124" height="52" rx="10" fill="#d8e7fa" stroke="#8ab4e8" stroke-width="1.5"/>
  <text x="617" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e4d8c">trading-service</text>
  <text x="617" y="116" text-anchor="middle" font-size="10" fill="#3c6094">外部（WS）</text>

  <rect x="683" y="76" width="124" height="52" rx="10" fill="#d5ecdc" stroke="#7fc08f" stroke-width="1.5"/>
  <text x="745" y="96" text-anchor="middle" font-size="11.5" font-weight="700" fill="#245c34">PositionManager</text>
  <text x="745" y="116" text-anchor="middle" font-size="10" fill="#3f7a52">仓位唯一写者</text>

  <rect x="811" y="76" width="124" height="52" rx="10" fill="#f7d8e2" stroke="#e093aa" stroke-width="1.5"/>
  <text x="873" y="99" text-anchor="middle" font-size="12.5" font-weight="700" fill="#94334f">Store</text>
  <text x="873" y="116" text-anchor="middle" font-size="10" fill="#a8576e">内存总表 · 落盘</text>

  <!-- ===== 生命线 ===== -->
  <g stroke="#c4cdd9" stroke-width="1.4" stroke-dasharray="5 5">
    <line x1="105" y1="128" x2="105" y2="862"/>
    <line x1="233" y1="128" x2="233" y2="862"/>
    <line x1="361" y1="128" x2="361" y2="862"/>
    <line x1="489" y1="128" x2="489" y2="862"/>
    <line x1="617" y1="128" x2="617" y2="862"/>
    <line x1="745" y1="128" x2="745" y2="862"/>
    <line x1="873" y1="128" x2="873" y2="862"/>
  </g>

  <!-- ============ 1 ============ -->
  <circle cx="22" cy="158" r="11" fill="#3b5f94"/>
  <text x="22" y="162" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <line x1="105" y1="158" x2="227" y2="158" stroke="#3b5f94" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="166" y="150" text-anchor="middle" font-size="11.5" fill="#1f2937" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Vec&lt;InstrumentAction&gt;</text>

  <!-- ============ 2 ============ -->
  <circle cx="22" cy="214" r="11" fill="#3b5f94"/>
  <text x="22" y="218" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <line x1="233" y1="214" x2="355" y2="214" stroke="#3b5f94" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="294" y="200" text-anchor="middle" font-size="11.5" fill="#1f2937" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">action_dispatcher 分派</text>
  <text x="294" y="232" text-anchor="middle" font-size="11" fill="#6b7280" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">Reverse 先平后开 · 平在前</text>

  <!-- ============ 3 ============ -->
  <circle cx="22" cy="270" r="11" fill="#3b5f94"/>
  <text x="22" y="274" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <line x1="361" y1="270" x2="867" y2="270" stroke="#3b5f94" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="614" y="256" text-anchor="middle" font-size="11.5" fill="#1f2937" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">insert signal 行（Created）</text>
  <text x="614" y="288" text-anchor="middle" font-size="11" fill="#6b7280" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">→ 校验（Validated / Rejected）</text>

  <!-- ============ 4 ============ -->
  <circle cx="22" cy="326" r="11" fill="#3b5f94"/>
  <text x="22" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <line x1="361" y1="326" x2="483" y2="326" stroke="#3b5f94" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="422" y="318" text-anchor="middle" font-size="11.5" fill="#1f2937" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">submit_fut（在途去重后）</text>

  <!-- ============ 5 ============ -->
  <circle cx="22" cy="382" r="11" fill="#3b5f94"/>
  <text x="22" y="386" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
  <line x1="489" y1="382" x2="611" y2="382" stroke="#3b5f94" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="550" y="368" text-anchor="middle" font-size="11.5" fill="#1f2937" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">place_order</text>
  <text x="550" y="400" text-anchor="middle" font-size="10.5" fill="#6b7280" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">开仓 order_cash / 平仓 quantity+reduce_only</text>

  <!-- ============ 6 ============ -->
  <circle cx="22" cy="438" r="11" fill="#b07d2a"/>
  <text x="22" y="442" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
  <line x1="617" y1="438" x2="495" y2="438" stroke="#b07d2a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrBack)"/>
  <text x="556" y="430" text-anchor="middle" font-size="11.5" fill="#7a5a1e" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">ack(NEW, client_order_id)</text>

  <!-- ============ 7 ============ -->
  <circle cx="22" cy="494" r="11" fill="#3b5f94"/>
  <text x="22" y="498" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">7</text>
  <line x1="361" y1="494" x2="867" y2="494" stroke="#3b5f94" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="614" y="486" text-anchor="middle" font-size="11.5" fill="#1f2937" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">signal → Submitted（绑定 order_id）</text>

  <!-- ============ 8 自调用 ============ -->
  <circle cx="22" cy="550" r="11" fill="#3b5f94"/>
  <text x="22" y="554" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">8</text>
  <path d="M233,544 L300,544 L300,562 L239,562" fill="none" stroke="#3b5f94" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="310" y="557" font-size="11.5" fill="#1f2937" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">RouteBind（T7 路由表注册）</text>

  <!-- ============ 9 ============ -->
  <circle cx="22" cy="606" r="11" fill="#b07d2a"/>
  <text x="22" y="610" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">9</text>
  <line x1="617" y1="606" x2="495" y2="606" stroke="#b07d2a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrBack)"/>
  <text x="556" y="592" text-anchor="middle" font-size="11.5" fill="#7a5a1e" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">order_event(PARTIAL/FILLED)</text>
  <text x="556" y="624" text-anchor="middle" font-size="10.5" fill="#8d742e" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">异步回报 · 可隔多根 bar</text>

  <!-- ============ 10 ============ -->
  <circle cx="22" cy="662" r="11" fill="#b07d2a"/>
  <text x="22" y="666" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">10</text>
  <line x1="489" y1="662" x2="239" y2="662" stroke="#b07d2a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrBack)"/>
  <text x="364" y="654" text-anchor="middle" font-size="11.5" fill="#7a5a1e" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">ClientEvent → T7 精确路由 → OrderUpdate</text>

  <!-- ============ 11 ============ -->
  <circle cx="22" cy="718" r="11" fill="#3b5f94"/>
  <text x="22" y="722" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">11</text>
  <line x1="361" y1="718" x2="867" y2="718" stroke="#3b5f94" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="614" y="704" text-anchor="middle" font-size="11.5" fill="#1f2937" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">signal → Accepted → Filled</text>
  <text x="614" y="736" text-anchor="middle" font-size="10.5" fill="#6b7280" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">仅 FILLED 产出 FillEvent</text>

  <!-- ============ 12 ============ -->
  <circle cx="22" cy="774" r="11" fill="#3b5f94"/>
  <text x="22" y="778" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">12</text>
  <line x1="233" y1="774" x2="739" y2="774" stroke="#3b5f94" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="486" y="760" text-anchor="middle" font-size="11.5" fill="#1f2937" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">apply_open_fill / apply_close_fill</text>
  <text x="486" y="792" text-anchor="middle" font-size="10.5" fill="#6b7280" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">同 task 直调 · 无跨 task 通道</text>

  <!-- ============ 13 ============ -->
  <circle cx="22" cy="830" r="11" fill="#3b5f94"/>
  <text x="22" y="834" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">13</text>
  <line x1="745" y1="830" x2="867" y2="830" stroke="#3b5f94" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="806" y="816" text-anchor="middle" font-size="11.5" fill="#1f2937" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">position / stop / history / cooldown</text>
  <text x="806" y="848" text-anchor="middle" font-size="10.5" fill="#6b7280" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">四类行写入</text>

  <!-- 图例 -->
  <g>
    <line x1="280" y1="906" x2="316" y2="906" stroke="#3b5f94" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="324" y="910" font-size="10.5" fill="#6b7280">同步调用（-&gt;&gt;）</text>
    <line x1="430" y1="906" x2="466" y2="906" stroke="#b07d2a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrBack)"/>
    <text x="474" y="910" font-size="10.5" fill="#6b7280">异步回报 / 回调（--&gt;&gt;）</text>
    <text x="620" y="910" font-size="10.5" fill="#9ca3af">虚线生命线 = 参与者存在期 · 文字白描边防叠线</text>
  </g>
</svg>
