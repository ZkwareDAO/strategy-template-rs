<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540"
     font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#3b5f94"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="540" fill="#ffffff"/>
  <text x="28" y="38" font-size="17" font-weight="700" fill="#1f2937">配置架构（多源合并）</text>
  <text x="28" y="58" font-size="11" fill="#6b7280">§4 · 合并优先级：CLI 显式 &gt; per-symbol 文件 &gt; _global.yaml &gt; 内置默认</text>

  <!-- 五源 -->
  <rect x="20" y="80" width="280" height="56" rx="10" fill="#d8e7fa" stroke="#8ab4e8" stroke-width="1.5"/>
  <text x="160" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#1e4d8c">CLI 显式参数</text>
  <text x="160" y="124" text-anchor="middle" font-size="10" fill="#3c6094">--strategy / --symbol / …</text>

  <rect x="20" y="152" width="280" height="56" rx="10" fill="#d8e7fa" stroke="#8ab4e8" stroke-width="1.5"/>
  <text x="160" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#1e4d8c">config/_global.yaml</text>
  <text x="160" y="196" text-anchor="middle" font-size="10" fill="#3c6094">services: trading 共享基线（K线同连接，无 market）</text>

  <rect x="20" y="224" width="280" height="56" rx="10" fill="#d8e7fa" stroke="#8ab4e8" stroke-width="1.5"/>
  <text x="160" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#1e4d8c">config/{strategy}/{SYMBOL}.yaml</text>
  <text x="160" y="268" text-anchor="middle" font-size="10" fill="#3c6094">per-symbol 覆盖</text>

  <rect x="20" y="296" width="280" height="56" rx="10" fill="#d8e7fa" stroke="#8ab4e8" stroke-width="1.5"/>
  <text x="160" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#1e4d8c">config/contracts.yaml</text>
  <text x="160" y="340" text-anchor="middle" font-size="10" fill="#3c6094">期货乘数 / 保证金 / 费率 / 时段</text>

  <rect x="20" y="368" width="280" height="56" rx="10" fill="#f7d8e2" stroke="#e093aa" stroke-width="1.5"/>
  <text x="160" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#94334f">环境变量 STRATEGY_SECRET</text>
  <text x="160" y="412" text-anchor="middle" font-size="10" fill="#a8576e">密钥不入文件</text>

  <!-- 汇聚箭头 -->
  <path d="M300,108 C 350,108 350,225 384,242" fill="none" stroke="#3b5f94" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M300,180 C 350,180 350,232 384,246" fill="none" stroke="#3b5f94" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="300" y1="252" x2="384" y2="252" stroke="#3b5f94" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M300,324 C 350,324 350,270 384,258" fill="none" stroke="#3b5f94" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M300,396 C 350,396 350,278 384,262" fill="none" stroke="#3b5f94" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- 合并器 -->
  <rect x="390" y="212" width="190" height="84" rx="10" fill="#e3d8f7" stroke="#a98fe0" stroke-width="1.5"/>
  <text x="485" y="246" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c2e94">合并器 config.rs</text>
  <text x="485" y="268" text-anchor="middle" font-size="10.5" fill="#6a4fa3">load / load_dir</text>

  <line x1="580" y1="254" x2="634" y2="254" stroke="#3b5f94" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- SymbolSpec -->
  <rect x="640" y="110" width="320" height="288" rx="12" fill="#e7f5ea" stroke="#c8e6d0"/>
  <text x="658" y="138" font-size="12.5" font-weight="700" fill="#2f7a45">SymbolSpec ×N（装配产物）</text>
  <g font-size="11" fill="#245c34">
    <rect x="658" y="152" width="136" height="30" rx="8" fill="#d5ecdc" stroke="#7fc08f"/>
    <text x="726" y="172" text-anchor="middle">strategy</text>
    <rect x="806" y="152" width="136" height="30" rx="8" fill="#d5ecdc" stroke="#7fc08f"/>
    <text x="874" y="172" text-anchor="middle">symbol</text>
    <rect x="658" y="192" width="136" height="30" rx="8" fill="#d5ecdc" stroke="#7fc08f"/>
    <text x="726" y="212" text-anchor="middle">timeframe</text>
    <rect x="806" y="192" width="136" height="30" rx="8" fill="#d5ecdc" stroke="#7fc08f"/>
    <text x="874" y="212" text-anchor="middle">venue_key</text>
    <rect x="658" y="232" width="136" height="30" rx="8" fill="#d5ecdc" stroke="#7fc08f"/>
    <text x="726" y="252" text-anchor="middle">exchange / account</text>
    <rect x="806" y="232" width="136" height="30" rx="8" fill="#d5ecdc" stroke="#7fc08f"/>
    <text x="874" y="252" text-anchor="middle">leverage</text>
    <rect x="658" y="272" width="136" height="30" rx="8" fill="#d5ecdc" stroke="#7fc08f"/>
    <text x="726" y="292" text-anchor="middle">mode</text>
    <rect x="806" y="272" width="136" height="30" rx="8" fill="#d5ecdc" stroke="#7fc08f"/>
    <text x="874" y="292" text-anchor="middle">contract</text>
    <rect x="658" y="312" width="136" height="30" rx="8" fill="#d5ecdc" stroke="#7fc08f"/>
    <text x="726" y="332" text-anchor="middle">risk</text>
    <rect x="806" y="312" width="136" height="30" rx="8" fill="#d5ecdc" stroke="#7fc08f"/>
    <text x="874" y="332" text-anchor="middle">submit_enabled</text>
  </g>
  <text x="658" y="374" font-size="10.5" fill="#3f7a52">mode + submit_enabled 构成发单双保险</text>

  <line x1="800" y1="398" x2="800" y2="430" stroke="#3b5f94" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- bootstrap -->
  <rect x="660" y="436" width="280" height="48" rx="24" fill="#efeafc" stroke="#a98fe0" stroke-width="1.5"/>
  <text x="800" y="466" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c2e94">bootstrap 装配</text>

  <!-- 底注 -->
  <rect x="20" y="452" width="560" height="48" rx="10" fill="#f8fafc" stroke="#d8e0ea"/>
  <text x="36" y="474" font-size="10.5" fill="#4b5563">paper_trading 在装配层强制关闭真单闸门；services 未配置 fail-fast 报错，</text>
  <text x="36" y="491" font-size="10.5" fill="#4b5563">不静默用占位端点跑（config.rs 注释约定优先级）</text>
</svg>
