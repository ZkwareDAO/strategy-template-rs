<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420"
     font-family="Noto Sans SC, Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#3b5f94"/>
    </marker>
    <marker id="arrBack" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#b07d2a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="420" fill="#ffffff"/>
  <text x="28" y="38" font-size="17" font-weight="700" fill="#1f2937">行情流（K 线驱动）</text>
  <text x="28" y="58" font-size="11" fill="#6b7280">§2.1 · 1m 增量聚合 · 仅已闭合桶进入 closed 序列</text>

  <!-- 源头 -->
  <rect x="20" y="88" width="190" height="80" rx="10" fill="#d8e7fa" stroke="#8ab4e8" stroke-width="1.5"/>
  <text x="115" y="114" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e4d8c">trading-service K线帧</text>
  <text x="115" y="136" text-anchor="middle" font-size="10" fill="#3c6094">subscribe_kline → kline_1m_batch</text>
  <text x="115" y="154" text-anchor="middle" font-size="10" fill="#3c6094">只推定稿 bar（无 is_final）</text>

  <rect x="20" y="212" width="190" height="80" rx="10" fill="#d8e7fa" stroke="#8ab4e8" stroke-width="1.5"/>
  <text x="115" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#1e4d8c">get_klines 回填</text>
  <text x="115" y="264" text-anchor="middle" font-size="10" fill="#3c6094">kline_history 翻页 · 本地 CSV 主</text>

  <!-- 分发器 -->
  <rect x="280" y="148" width="190" height="84" rx="10" fill="#e3d8f7" stroke="#a98fe0" stroke-width="1.5"/>
  <text x="375" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#4c2e94">TradingServiceKlineClient</text>
  <text x="375" y="202" text-anchor="middle" font-size="10.5" fill="#6a4fa3">router 水位去重 → per-symbol 扇出</text>

  <!-- Feed -->
  <rect x="530" y="148" width="180" height="84" rx="10" fill="#d5ecdc" stroke="#7fc08f" stroke-width="1.5"/>
  <text x="620" y="180" text-anchor="middle" font-size="12.5" font-weight="700" fill="#245c34">Feed（每实例）</text>
  <text x="620" y="202" text-anchor="middle" font-size="10.5" fill="#3f7a52">1m→TF 增量聚合 · newly_closed</text>

  <!-- Ctx -->
  <rect x="770" y="88" width="180" height="70" rx="10" fill="#f7ecc8" stroke="#d9bb63" stroke-width="1.5"/>
  <text x="860" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7a5f14">快照构造</text>
  <text x="860" y="138" text-anchor="middle" font-size="10" fill="#8d742e">InstrumentSnapshot · 组合上下文</text>

  <!-- Strategy -->
  <rect x="770" y="212" width="180" height="80" rx="10" fill="#d5ecdc" stroke="#7fc08f" stroke-width="1.5"/>
  <text x="860" y="242" text-anchor="middle" font-size="12.5" font-weight="700" fill="#245c34">Strategy 回调</text>
  <text x="860" y="262" text-anchor="middle" font-size="10" fill="#3f7a52">on_cross_section_bars</text>
  <text x="860" y="280" text-anchor="middle" font-size="10" fill="#3f7a52">统一回调（快照向量）</text>

  <!-- 箭头 -->
  <line x1="210" y1="128" x2="274" y2="168" stroke="#3b5f94" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="236" y="126" text-anchor="middle" font-size="10" fill="#4b5563" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">KlineEvent::Closed</text>

  <line x1="210" y1="252" x2="274" y2="216" stroke="#b07d2a" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrBack)"/>
  <text x="238" y="272" text-anchor="middle" font-size="10" fill="#7a5a1e" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">回填（只进缓存）</text>

  <line x1="470" y1="190" x2="524" y2="190" stroke="#3b5f94" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="497" y="180" text-anchor="middle" font-size="10" fill="#4b5563" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">扇出</text>

  <line x1="710" y1="190" x2="764" y2="136" stroke="#3b5f94" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="732" y="152" text-anchor="middle" font-size="10" fill="#4b5563" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">newly_closed</text>

  <line x1="860" y1="158" x2="860" y2="206" stroke="#3b5f94" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- 底注 -->
  <rect x="20" y="326" width="940" height="76" rx="10" fill="#f8fafc" stroke="#d8e0ea"/>
  <text x="36" y="352" font-size="11" font-weight="700" fill="#3b5f94">要点（app/src/ts_kline.rs · data/src/client.rs）：</text>
  <text x="36" y="372" font-size="10.5" fill="#4b5563">① 大周期桶恰好收满才入 closed 序列（对齐 Python get_closed_data）　② 预载起点在桶中间 → 首个残缺桶永不入 closed（drop_partial_head）</text>
  <text x="36" y="391" font-size="10.5" fill="#4b5563">③ Reconnected / Lagged(n) 触发 get_klines 回填补缺（本地 CSV 主 + 分页补足；只进聚合/缓存，不重放历史信号）</text>
</svg>
