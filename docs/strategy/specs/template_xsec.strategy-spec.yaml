strategy_name: template_xsec
rust_module: template_xsec
prefix: TEMPLATEXSEC
market: crypto / futures
direction: long
timeframes: [5m, 15m]
extra_timeframes: [1m, 1h]
symbols: [BTCUSDT, ETHUSDT, RB, I, CU]
data_source:
  dir: data/klines
  note: "crypto 走 data/klines/1m/binance/...；期货走 data/klines/1m/SHFE/..."
backtest:
  start: "20260109"
  end: "20260113"
  initial_cash: 10000

entry:
  description: "横截面轮动：按特征排名保留 top_k 等权；N=1 退化为单标买入"
  conditions:
    - "rebalance_due 或 flat_entry 且空仓"
    - "候选 !stale、entry_eligible、rank_indicator 有值"
    - "trend_tf 非空时只保留趋势向上标的"
    - "higher_is_better 控制升降序，tie-break 按 namespaced_key"

exit:
  stop_loss: "stop_mode=percent（默认 -2%）或 stop_mode=atr"
  signal_reversal: "掉出 top_k → Adjust{0}（stale/特征缺失时保持仓位）"
  note: "不产生 Close；组合级退出走 portfolio_exit/CloseMaster"

default_params:
  rank_indicator: macd
  higher_is_better: true
  top_k: 3
  flat_entry: true
  trend_tf: ""
  stop_mode: percent
  stop_loss_pct: 2.0

config_files:
  - config/tpl_xsec_crypto/strategy.yaml
  - config/tpl_xsec_futures/strategy.yaml
