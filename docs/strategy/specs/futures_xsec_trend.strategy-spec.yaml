strategy_name: futures_xsec_trend
rust_module: futures_xsec_trend
prefix: FUTURESXSECTREND
market: futures
direction: long
timeframes: [15m]
extra_timeframes: [1h]
symbols: [RB, I, CU]
data_source:
  dir: data/klines
  note: "期货数据必须由用户提供；目标路径 data/klines/1m/SHFE/cn_futures/<SYM>_1m.csv（roll_build 生成）"
backtest:
  start: "20260101"
  end: "20260630"
  initial_cash: 2000000

entry:
  description: "H1 动量横截面轮换：一个组合总仓、多品种子仓，只做多"
  conditions:
    - "base 15m 闭合计数达到 rebalance.every_bars=12 且 rebalance_due"
    - "按 H1 lookback=12 动量降序保留 top_k=2"
    - "1h 收盘价 > EMA(trend_ema=60) 作为趋势过滤；entry_eligible 且 !stale"

exit:
  stop_loss: "入场价 - atr_stop_mult(2.0) × ATR(14, 15m)"
  trailing_stop: ""
  signal_reversal: "跌破止损、H1 趋势转空或掉出 top_k → 目标调回 0（止损/反转不等调仓窗口）"
  note: "merge_positions=true；组合级退出走 CloseMaster，portfolio_exit.stop_loss_pct=8"

default_params:
  lookback: 12
  trend_ema: 60
  trend_tf: "1h"
  atr_period: 14
  atr_stop_mult: 2.0
  top_k: 2

config_files:
  - config/ctp_multi_xsec/strategy.yaml
