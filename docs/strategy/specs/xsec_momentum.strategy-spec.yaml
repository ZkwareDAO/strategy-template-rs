strategy_name: xsec_momentum
rust_module: xsec_momentum
prefix: XSECMOMENTUM
market: crypto
direction: long
timeframes: [5m]
extra_timeframes: [15m]
symbols: [BTCUSDT, ETHUSDT]
data_source:
  dir: data/klines
  note: "crypto 默认 data/klines/1m/binance/crypto_perpetual/<SYM>_1m.csv"
backtest:
  start: "20260801"
  end: "20260826"
  initial_cash: 10000

entry:
  description: "MACD 横截面动量：只做多，按 15m MACD 降序保留 top_k"
  conditions:
    - "base TF 闭合且 rebalance_due"
    - "候选 !stale 且 entry_eligible（配置 entry: adx(5m) > 20）"
    - "按 15m MACD 值降序排名，保留前 top_k 等权持有"
    - "MACD 缺失不参与排名；bottom_k 必须为 0"

exit:
  stop_loss: "Open.stop_price = 入场价 × 0.98（-2%）"
  trailing_stop: "配置 portfolio_exit.trailing: arm 10% / giveback 40%"
  signal_reversal: "掉出 top_k → Adjust{0}；配置 exit overrides（ETH: macd_cross == bullish）"
  note: "组合级退出走 CloseMaster；portfolio_exit.stop_loss_pct=8"

default_params:
  top_k: 3
  bottom_k: 0

config_files:
  - config/xsec_momentum/strategy.yaml
