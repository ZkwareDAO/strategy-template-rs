strategy_name: xsec_template
rust_module: xsec_template
prefix: XSECTEMPLATE
market: crypto
direction: long
timeframes: [15m]
extra_timeframes: [1h]
symbols: [SOLUSDT, BNBUSDT]
data_source:
  dir: data/klines
  note: "crypto 默认 data/klines/1m/binance/crypto_perpetual/<SYM>_1m.csv"
backtest:
  start: "20260901"
  end: "20260915"
  initial_cash: 10000

entry:
  description: "单标空仓做多；多标调仓窗口按指标排名等权持有 top_k"
  conditions:
    - "单标：!stale 且 entry_eligible 且空仓 → 开多（忽略 rebalance_due）"
    - "多标：rebalance_due 时按 rank_indicator 排名（higher_is_better）保留 top_k"
    - "候选必须 !stale 且 rank_indicator 特征存在；缺失不参与排名/不开仓"

exit:
  stop_loss: "Open.stop_price = 入场价 × 0.98（-2%）"
  trailing_stop: ""
  signal_reversal: "掉出 top_k → Adjust{0}；stale/缺特征持仓保持到下一轮"
  note: "配置 exit/portfolio_exit 由引擎执行；组合级退出用 CloseMaster"

default_params:
  rank_indicator: macd
  higher_is_better: true
  top_k: 3

config_files:
  - config/xsec_template/strategy.yaml
  - config/xsec_template_single/strategy.yaml
